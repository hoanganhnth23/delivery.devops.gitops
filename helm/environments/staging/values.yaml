global:
  environment: staging
  domain: staging.delivery.local
  garPrefix: asia-southeast1-docker.pkg.dev/lithe-paratext-506208-s5/delivery-repo

# =============================================================================
# Staging là môi trường chạy chính (coi như prod). Cấu hình production chỉ để
# tham chiếu luồng. Các khối dưới đây dùng YAML anchor để mọi service đồng nhất.
# File này được sinh có chủ đích theo bảng service; sửa một service thì sửa khối của nó.
# =============================================================================

# Giá trị cho templates/platform-env.yaml (ConfigMap dùng chung).
platformEnv:
  kafkaBootstrap: delivery-kafka-kafka-bootstrap:9092
  redisHost: redis
  # Chưa có OTLP collector trên staging: tắt export trace để không tốn tài nguyên.
  tracingEnabled: "false"
  tracingSampleProbability: "0.05"

_defaults:
  # Nấc 1 "yếu nhưng đủ chạy": request nhỏ, limit cho phép burst khi có tải.
  # Tối ưu xong mới nâng (xem plan).
  resources: &serviceResources
    limits:
      cpu: 1000m
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 384Mi
  envFrom: &platformEnvFrom
    - configMapRef:
        name: platform-env
    # Tuỳ chọn, tạo bằng scripts/staging-secrets.sh từ file env local:
    # SMTP_*, MAPBOX_SERVER_TOKEN, VNPAY_*...
    - secretRef:
        name: delivery-app-secrets
        optional: true
  # Spring configtree đọc /run/secrets/<key> (internal-secret, registration-canary-hash-key).
  # Secret tạo bằng scripts/staging-secrets.sh, không commit.
  secretMounts: &runtimeSecretMounts
    - name: runtime-secrets
      secretName: delivery-runtime-secrets
      mountPath: /run/secrets
  # Khi chạy test tải: đổi interval 5s / scrapeTimeout 4s, xong trả về 15s.
  metrics: &serviceMetrics
    serviceMonitor:
      enabled: true
      interval: 15s
      scrapeTimeout: 10s

api-gateway:
  fullnameOverride: api-gateway
  replicaCount: 1
  image:
    repository: asia-southeast1-docker.pkg.dev/lithe-paratext-506208-s5/delivery-repo/api-gateway
    tag: "latest"
  service:
    port: 8079
    targetPort: 8079
  resources: *serviceResources
  metrics: *serviceMetrics
  envFrom: *platformEnvFrom
  secretMounts: *runtimeSecretMounts
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: "staging"

auth-service:
  fullnameOverride: auth-service
  replicaCount: 1
  image:
    repository: asia-southeast1-docker.pkg.dev/lithe-paratext-506208-s5/delivery-repo/auth-service
    tag: "latest"
  service:
    port: 8081
    targetPort: 8081
  resources: *serviceResources
  metrics: *serviceMetrics
  envFrom: *platformEnvFrom
  secretMounts:
    - name: runtime-secrets
      secretName: delivery-runtime-secrets
      mountPath: /run/secrets
    # Cặp khoá RSA ký JWT (PEM: private PKCS8, public X509).
    - name: jwt-keys
      secretName: delivery-jwt
      mountPath: /etc/delivery/jwt
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: "staging"
    - name: JWT_PRIVATE_KEY_PATH
      value: /etc/delivery/jwt/private.pem
    - name: JWT_PUBLIC_KEY_PATH
      value: /etc/delivery/jwt/public.pem
    - name: SPRING_DATASOURCE_URL
      value: "jdbc:postgresql://delivery-pg-rw:5432/auth_db"
    - name: SPRING_DATASOURCE_USERNAME
      valueFrom:
        secretKeyRef: { name: delivery-pg-app, key: username }
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef: { name: delivery-pg-app, key: password }
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef: { name: delivery-pg-app, key: password }

