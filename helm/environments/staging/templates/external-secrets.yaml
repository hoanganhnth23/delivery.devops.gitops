{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.clusterSecretStoreName | default "gcp-secret-store" }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.externalSecrets.projectID | default "lithe-paratext-506208-s5" }}
      auth:
        secretRef:
          secretAccessKeySecretRef:
            name: gcp-secret-manager-credentials
            key: service-account-key.json
            namespace: external-secrets
---
# Đồng bộ cặp khóa RSA cho auth-service ký JWT
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: delivery-jwt-external
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStoreName | default "gcp-secret-store" }}
  target:
    name: delivery-jwt
    creationPolicy: Owner
  data:
    - secretKey: private.pem
      remoteRef:
        key: delivery-jwt-private
    - secretKey: public.pem
      remoteRef:
        key: delivery-jwt-public
---
# Đồng bộ các khóa runtime (internal-secret, web-bff encryption key, canary hash key)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: delivery-runtime-secrets-external
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStoreName | default "gcp-secret-store" }}
  target:
    name: delivery-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: internal-secret
      remoteRef:
        key: delivery-internal-secret
    - secretKey: registration-canary-hash-key
      remoteRef:
        key: delivery-canary-hash-key
    - secretKey: web-bff.encryption-key-base64
      remoteRef:
        key: delivery-web-bff-key
{{- end }}
