# Default values for microservice chart.
replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

image:
  repository: asia-southeast1-docker.pkg.dev/lithe-paratext-506208-s5/delivery-repo/api-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  # Service không gọi Kubernetes API. Tắt token còn tránh xung đột mount: secretMounts
  # gắn vào /run/secrets (read-only) nên kubelet không tạo được
  # /var/run/secrets/kubernetes.io bên trong (/var/run -> /run).
  automountToken: false

podAnnotations: {}

# Tắt biến môi trường kiểu Docker link (<SVC>_PORT=tcp://ip:port) Kubernetes tự gán
# cho mọi Service cùng namespace: Service "redis" sinh REDIS_PORT đè cấu hình app.
enableServiceLinks: false

# Actuator (health + prometheus) chạy trên port quản trị nội bộ, không đi qua Service http.
management:
  enabled: true
  port: 9090

# kube-prometheus-stack chỉ đọc ServiceMonitor/PodMonitor, không đọc annotation prometheus.io/*.
metrics:
  serviceMonitor:
    enabled: false
    path: /actuator/prometheus
    interval: 15s
    scrapeTimeout: 10s

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: api.delivery.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 384Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Java khởi động chậm khi nhiều service cùng lên trên node nhỏ: startupProbe cho tối đa
# 10 phút; liveness/readiness chỉ bắt đầu sau khi startup thành công.
startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: management
  periodSeconds: 10
  timeoutSeconds: 3
  # 10 phút: 19 JVM khởi động cùng lúc trên node 2 vCPU đo được ~290s/service.
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: management
  initialDelaySeconds: 45
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: management
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

env: []
# - name: SPRING_PROFILES_ACTIVE
#   value: staging

envFrom: []
# - configMapRef:
#     name: common-config
# - secretRef:
#     name: db-credentials

config: {}

# Secret mount thành file (không đưa vào env). Vd. Spring configtree đọc /run/secrets/<key>.
secretMounts: []
# - name: runtime-secrets
#   secretName: delivery-runtime-secrets
#   mountPath: /run/secrets
#   optional: false
# application.yaml / properties if mounted as configmap

# Pod balancing across nodes to prevent hotspot saturation
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchExpressions:
        - key: app.kubernetes.io/instance
          operator: In
          values: ["delivery-staging", "delivery"]
