{{- if .Values.plugins.cors.enabled }}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: {{ .Release.Name }}-cors
  labels:
    app.kubernetes.io/name: kong-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
plugin: cors
config:
  origins:
    {{- range .Values.plugins.cors.origins }}
    - {{ . | quote }}
    {{- end }}
  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  headers:
    - Accept
    - Accept-Version
    - Content-Length
    - Content-Type
    - Date
    - Authorization
    - X-Request-ID
    - X-User-Id
    - X-User-Roles
    - X-Device-Id
  exposed_headers:
    - X-Request-ID
    - Content-Disposition
  credentials: {{ .Values.plugins.cors.credentials }}
  max_age: 3600
---
{{- end }}

{{- if .Values.plugins.correlationId.enabled }}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: {{ .Release.Name }}-correlation-id
  labels:
    app.kubernetes.io/name: kong-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
plugin: correlation-id
config:
  header_name: {{ .Values.plugins.correlationId.headerName | quote }}
  generator: uuid
  echo_downstream: true
---
{{- end }}

{{- if .Values.plugins.rateLimiting.enabled }}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: {{ .Release.Name }}-rate-limiting
  labels:
    app.kubernetes.io/name: kong-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
plugin: rate-limiting
config:
  minute: {{ .Values.plugins.rateLimiting.minute | int64 }}
  policy: {{ .Values.plugins.rateLimiting.policy | quote }}
  fault_tolerant: true
---
{{- end }}

{{- if .Values.plugins.prometheus.enabled }}
---
# Plugin toàn cục: Kong xuất metric (request, latency, upstream) ở cổng status /metrics.
apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: {{ .Release.Name }}-prometheus
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | default "kong" }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    global: "true"
plugin: prometheus
config:
  status_code_metrics: true
  latency_metrics: true
  upstream_health_metrics: true
  bandwidth_metrics: true
{{- end }}
