# SINH TỰ ĐỘNG bởi scripts/gen-kong-edge-routes.py từ GatewayRouteConfig.java. Không sửa tay.
routes:
  - name: web-bff-service-authenticated-read
    upstream: webBff
    rateLimit: authenticated_read
    websocket: false
    methods: [GET, HEAD, OPTIONS]
    paths:
      - '^/bff(/.*)?$'
  - name: web-bff-service-mutation
    upstream: webBff
    rateLimit: mutation
    websocket: false
    methods: [POST, PUT, PATCH, DELETE]
    paths:
      - '^/bff(/.*)?$'
  - name: auth-service-jwks-authenticated-read
    upstream: auth
    rateLimit: authenticated_read
    websocket: false
    methods: [GET]
    paths:
      - '^/\.well-known/jwks\.json$'
  - name: auth-service-public-public-auth
    upstream: auth
    rateLimit: public_auth
    websocket: false
    methods: [POST]
    paths:
      - '^/api/auth/login$'
      - '^/api/auth/register$'
      - '^/api/auth/social-login$'
      - '^/api/auth/refresh-token$'
      - '^/api/auth/logout$'
      - '^/api/auth/forgot-password$'
      - '^/api/auth/reset-password$'
      - '^/api/auth/email-verification/request$'
      - '^/api/auth/email-verification/confirm$'
  - name: auth-service-registration-status-public-auth
