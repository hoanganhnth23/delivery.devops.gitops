# Default values for kong-gateway Helm chart on GKE
replicaCount: 2

image:
  repository: kong
  tag: "3.7-alpine"
  pullPolicy: IfNotPresent

controller:
  enabled: true
  image:
    repository: kong/kubernetes-ingress-controller
    tag: "3.2"
    pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  httpPort: 80
  httpsPort: 443
  annotations:
    # GKE Cloud Load Balancer integration
    cloud.google.com/load-balancer-type: "External"

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

plugins:
  cors:
    enabled: true
    origins:
      - "*"
    credentials: true
  rateLimiting:
    enabled: true
    minute: 300
    policy: local # Can be switched to redis on staging/prod
  prometheus:
    enabled: false
  correlationId:
    enabled: true
    headerName: "X-Request-ID"

ingress:
  className: kong
  host: ""
  # Đặt {name, port} để route mọi path vào một upstream (vd. api-gateway) thay cho
  # danh sách route theo service bên dưới.
  upstream: {}
  tls:
    enabled: false
    secretName: ""

# Target services in K8s namespace
services:
  auth:
    name: auth-service
    port: 8080
  user:
    name: user-service
    port: 8080
  restaurant:
    name: restaurant-service
    port: 8080
  order:
    name: order-service
    port: 8080
  delivery:
    name: delivery-service
    port: 8080
  search:
    name: search-service
    port: 8080
  promotion:
    name: promotion-service
    port: 8080
  notification:
    name: notification-service
    port: 8080
  shipper:
    name: shipper-service
    port: 8080
  settlement:
    name: settlement-service
    port: 8080
  webBff:
    name: web-bff-service
    port: 8080
  match:
    name: match-service
    port: 8080
  tracking:
    name: tracking-service
    port: 8080
  analytics:
    name: analytics-service
    port: 8080

# Cửa vào thay hẳn Spring api-gateway (route sinh từ GatewayRouteConfig.java, xem
# templates/edge-routes.yaml). Khi bật, tắt ingress.upstream và route theo service ở trên.
edge:
  enabled: false
  # Hạn mức mặc định = application.properties của api-gateway cũ (mỗi IP / phút).
  rateLimits:
    public_auth: {minute: 10, failOpen: false}
    user_registration: {minute: 10, failOpen: false}
    public_catalog: {minute: 120, failOpen: true}
    authenticated_read: {minute: 300, failOpen: true}
    mutation: {minute: 30, failOpen: false}
    websocket_connection: {minute: 10, failOpen: false}
  rateLimitPolicy: redis
  redis:
    host: redis
    port: 6379
  upstreams:
    auth: {name: auth-service, port: 8081}
    user: {name: user-service, port: 8082}
    restaurant: {name: restaurant-service, port: 8083}
    order: {name: order-service, port: 8084}
    delivery: {name: delivery-service, port: 8085}
    search: {name: search-service, port: 8088}
    shipper: {name: shipper-service, port: 8089}
    settlement: {name: settlement-service, port: 8090}
    notification: {name: notification-service, port: 8091}
    webBff: {name: web-bff-service, port: 8091}
    flashsale: {name: flashsale-service, port: 8092}
    tracking: {name: tracking-service, port: 8093}
    promotion: {name: promotion-service, port: 8096}
    analytics: {name: analytics-service, port: 8097}
