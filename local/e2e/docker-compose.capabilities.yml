# Overlay for scripts/tier2-capabilities.sh: switches on capabilities that
# staging keeps off (delivery-zone check, stock reservation, post-pickup
# delivery exceptions, refund cases, voucher checkout).
# The script layers it on and removes it again; the base stack runs without it.
services:
  restaurant-service:
    environment:
      RESTAURANT_SERVICEABILITY_ENABLED: "true"
      RESTAURANT_INVENTORY_ENABLED: "true"
  order-service:
    environment:
      ORDER_SERVICEABILITY_ENFORCEMENT_ENABLED: "true"
      ORDER_INVENTORY_RESERVATION_ENABLED: "true"
      ORDER_VOUCHER_CHECKOUT_ENABLED: "true"
  promotion-service:
    environment:
      PROMOTION_CHECKOUT_ENABLED: "true"
  delivery-service:
    environment:
      DELIVERY_EXCEPTION_ENABLED: "true"
  settlement-service:
    environment:
      REFUND_PROCESSING_ENABLED: "true"
      SETTLEMENT_DELIVERY_EXCEPTION_PROCESSING_ENABLED: "true"
