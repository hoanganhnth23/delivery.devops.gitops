name: GitOps CD (validate + image promotion)

# ArgoCD là bên DUY NHẤT deploy lên cụm (branch staging -> môi trường staging,
# main -> production, production không deploy chung cụm). Workflow này không chạm
# vào cụm: chỉ kiểm tra chart và ghi image tag mới vào Git để ArgoCD sync.

on:
  push:
    branches:
      - staging
      - main
    paths:
      - 'helm/**'
      - 'argocd/**'
      - '.github/workflows/deploy-gke.yml'
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'
      service_name:
        description: 'Service cần đổi image tag (vd. order-service)'
        required: true
      image_tag:
        description: 'Image tag mới (vd. staging-abc1234 hoặc v1.0.0)'
        required: true
  repository_dispatch:
    types: [deploy_service]

jobs:
  validate:
    name: Helm lint & render
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint charts
        run: |
          helm lint helm/charts/microservice helm/charts/web-app helm/charts/staging-data

      - name: Render environments
        run: |
          for env in staging production; do
            helm dependency build "helm/environments/${env}"
            helm template "delivery-${env}" "helm/environments/${env}" --namespace "delivery-${env}" > "/tmp/${env}.yaml"
            echo "${env}: $(grep -c '^kind:' /tmp/${env}.yaml) manifests"
          done
          helm template delivery-staging-data helm/charts/staging-data --namespace delivery-staging > /tmp/staging-data.yaml
          echo "staging-data: $(grep -c '^kind:' /tmp/staging-data.yaml) manifests"

  promote-image:
    name: Write image tag to Git
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || github.event.client_payload.environment || 'staging' }}
      SERVICE: ${{ github.event.inputs.service_name || github.event.client_payload.service_name }}
      TAG: ${{ github.event.inputs.image_tag || github.event.client_payload.image_tag }}
    steps:
      - name: Resolve branch
        id: branch
        run: |
          case "$TARGET_ENV" in
            staging) echo "name=staging" >> "$GITHUB_OUTPUT" ;;
            production) echo "name=main" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown environment: $TARGET_ENV" >&2; exit 1 ;;
          esac

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.name }}

      - name: Update image tag and push
        run: |
          bash scripts/update-image.sh --service "$SERVICE" --tag "$TAG" --env "$TARGET_ENV" --commit
          git push origin "HEAD:${{ steps.branch.outputs.name }}"
