apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delivery-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/hoanganhnth/gitops-cd.git'
    targetRevision: main
    path: argocd/applications
    directory:
      # Staging là môi trường chạy chính; production chỉ để tham chiếu luồng,
      # không deploy chung cụm (tránh gấp đôi chi phí). Apply tay nếu cần.
      exclude: 'production.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
