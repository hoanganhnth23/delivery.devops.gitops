apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delivery-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/hoanganhnth23/delivery.devops.gitops.git'
    targetRevision: staging
    path: argocd/applications
    directory:
      # Staging là môi trường chạy chính; production chỉ để tham chiếu luồng,
      # không deploy chung cụm (tránh gấp đôi chi phí). Apply tay nếu cần.
      # Branch: staging -> môi trường staging, main -> production.
      # gateway.yaml (Kong) tạm tắt: cần CRD Kong + LoadBalancer tốn phí; k6 và
      # client đi thẳng vào api-gateway qua port-forward.
      exclude: '{production*.yaml,gateway.yaml}'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
