# Tầng dữ liệu staging: Postgres + Kafka + Redis + PodMonitor + dashboard.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delivery-staging-data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/hoanganhnth23/delivery.devops.gitops.git'
    targetRevision: staging
    path: helm/charts/staging-data
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: delivery-staging
  syncPolicy:
    automated:
      # Không prune tự động tầng dữ liệu: tránh xoá nhầm DB/Kafka khi đổi tên resource.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
