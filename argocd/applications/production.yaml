apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delivery-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/hoanganhnth23/delivery.devops.gitops.git'
    targetRevision: main
    path: helm/environments/production
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: delivery-production
  syncPolicy:
    # Manual sync recommended for production, or automated with approval gate
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
