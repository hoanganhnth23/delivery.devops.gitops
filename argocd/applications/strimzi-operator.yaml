# Operator Kafka (Strimzi, KRaft).
# watchAnyNamespace: namespace delivery-staging chưa tồn tại khi operator cài (wave -1),
# watchNamespaces cụ thể sẽ làm sync lỗi vì không tạo được RoleBinding.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://strimzi.io/charts/'
    chart: strimzi-kafka-operator
    targetRevision: 0.45.2
    helm:
      values: |
        watchAnyNamespace: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 384Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: strimzi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
