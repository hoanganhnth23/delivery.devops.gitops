apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-gateway-staging
  namespace: argocd
  annotations:
    # Sau kong-staging (CRD KongPlugin + IngressClass kong).
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/hoanganhnth23/delivery.devops.gitops.git'
    targetRevision: staging
    path: helm/charts/kong-gateway
    helm:
      valueFiles:
        - ../../environments/staging/kong-gateway-values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: delivery-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
